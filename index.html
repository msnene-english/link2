        .btn-check:disabled { background: #CBD5E1; cursor: not-allowed; }
        .explanation { margin-top: 20px; padding: 15px; background: #F1F5F9; border-radius: 8px; font-size: 17px; display: none; }
        .name-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--color-bg); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .gap-input.pending { background: var(--color-pending); color: var(--color-pending-text); transform: scale(1.02); }
        .gap-input.correct { background: var(--color-correct); color: white; border-color: var(--color-correct); }
        .gap-input.wrong { background: var(--color-wrong); color: white; border-color: var(--color-wrong); animation: shake 0.2s; }
        .chip { display: inline-block; padding: 8px 16px; margin: 4px; background: #E2E8F0; border-radius: 20px; cursor: pointer; font-size: 18px; user-select: none; }
        .chip:hover { background: #CBD5E1; }
        .chip.in-slot { background: var(--color-primary); color: white; }
        .slot-area { min-height: 60px; padding: 10px; border: 2px dashed #CBD5E1; border-radius: 8px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; }

            { id: 10, type: 'gap_fill_text', questionHTML: '<b>Tìm từ thừa:</b> I\'ve been to travelling round Europe all summer. It\'s the first time I\'ve<br>{{blank:b1}}', blanks: [{blankId: 'b1', correctAnswers: ['to']}], explanationHTML: '<b>Giải thích:</b> Từ thừa là <b>to</b>. Cấu trúc thì hiện tại hoàn thành tiếp diễn: have been + V-ing, không có to ở giữa.' },

            {
                id: 20,
                type: 'gap_fill_text',
                questionHTML: '<b>I. Write one word in each gap.</b><br><br>Holiday Blues<br>\'You\'ve {{blank:b1}} looking at that timetable for the last ten minutes. It can\'t be that confusing!\' said Sheila angrily.<br>\'I {{blank:b2}} wish you\'d be quiet! I\'ve {{blank:b3}} a splitting headache thanks to you!\' replied Matt.<br>\'Mum! Dad! Please!\' said Alison. \'You\'re both {{blank:b4}} very silly. {{blank:b5}} is no point at all in blaming each other. That\'s not going to help us find out what time the next train to Budapest is due to leave.\'<br>\'You {{blank:b6}} quite right, darling. I {{blank:b7}} sorry,\' said Sheila.<br>\'Me too,\' mumbled Matt. \'Now, let\'s have another look at this timetable. Well, it {{blank:b8}} like we {{blank:b9}} definitely missed the last train today. That was the 18.20 we just missed, wasn\'t it?\'<br>\'I {{blank:b10}} so,\' said Sheila. \'I mean, it did leave at 18.20. Whether it\'s actually going to Budapest or not is another question.\'<br>\'Well, one thing is {{blank:b11}} in doubt,\' said Matt.<br>\'What\'s that?\' asked Sheila and Alison together.<br>\'This is the worst holiday we\'ve {{blank:b12}} been on,\' said Matt. \'Next year, we\'re going to try something far less adventurous.\'<br>\'Agreed!\' said Sheila and Alison.',

        let userState = {};

        function escapeHTML(str){const d=document.createElement('div');d.textContent=str;return d.innerHTML;}
        function normalizeAnswer(str){return str.trim().replace(/\s+/g,' ').toLowerCase();}
        function normalizeSentence(str){return str.trim().replace(/\s+/g,' ').replace(/\s+([.,!?;:])/g,'$1');}
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playSine(freq, dur, gainVol) {
            if(!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(gainVol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch(e) {}
        }
        function playSelectSound() { playSine(600, 0.08, 0.15); }
        function playCorrectSound() { 
            playSine(800, 0.1, 0.2); 
            setTimeout(() => playSine(1200, 0.15, 0.2), 100); 
        }
        function playWrongSound() {
            if(!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }
        function playSubmitSound() { playSine(500, 0.12, 0.15); }

        function startQuiz() {
            const nameInput = document.getElementById('studentName').value.trim();
            if(!nameInput) {
                alert('Vui lòng nhập tên trước khi làm bài!');
                return;
            }
            studentName = nameInput;
            document.getElementById('nameScreen').style.display = 'none';
            initAudio();
            renderQuiz();
        }

        function initData() {
            quizData.forEach(q => {
                if(q.type === 'gap_fill_text') {
                    if(q.blanks) {
                        let ans = {};
                        q.blanks.forEach(b => ans[b.blankId] = '');
                        userState[q.id] = { answer: ans, checked: false, isCorrect: null, blankResults: {} };
                    }
                } else if(q.type === 'reordering') {
                    userState[q.id] = { answer: [], checked: false, isCorrect: null };
                }
            });
        }

        function renderQuiz() {
            initData();
            const container = document.getElementById('quizContainer');
            quizData.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = 'card-' + q.id;
                
                let contentHTML = '<div class="question-text">' + (idx+1) + '. ' + q.questionHTML + '</div>';
                
                if (q.type === 'gap_fill_text') {
                    let html = contentHTML;
                    q.blanks.forEach(b => {
                        const inputHtml = `<input type="text" class="gap-input" id="gap-${q.id}-${b.blankId}" oninput="handleGapInput(${q.id}, '${b.blankId}', this.value)">`;
                        html = html.replace(`{{blank:${b.blankId}}}`, inputHtml);
                    });
                    contentHTML = html;
                } else if (q.type === 'reordering') {
                    let bankHTML = '<div class="bank-area" id="bank-' + q.id + '">';
                    const shuffled = [...q.words].sort(() => Math.random() - 0.5);
                    shuffled.forEach(w => {
                        bankHTML += `<div class="chip" id="chip-${q.id}-${w.tokenId}" onclick="handleChipClick(${q.id}, '${w.tokenId}')">${escapeHTML(w.text)}</div>`;
                    });
                    bankHTML += '</div>';
                    let slotHTML = `<div class="slot-area" id="slot-${q.id}"></div>`;
                    contentHTML += slotHTML + bankHTML;
                }
                
                contentHTML += `<button id="check-btn-${q.id}" class="btn-check" disabled onclick="checkAnswer(${q.id})">Kiểm tra</button>`;
                contentHTML += `<div id="exp-${q.id}" class="explanation">${q.explanationHTML}</div>`;
                
                card.innerHTML = contentHTML;
                container.appendChild(card);
            });
            updateProgress();
        }

        function handleGapInput(qId, blankId, value) {
            initAudio();
            const st = userState[qId];
            if(st.checked) return;
            const input = document.getElementById(`gap-${qId}-${blankId}`);
            
            if(value.trim().length > 0 && st.answer[blankId] === '') {
                playSelectSound();
            }
            
            st.answer[blankId] = value;
            if(value.trim() !== '') {
                input.classList.add('pending');
            } else {
                input.classList.remove('pending');
            }
            
            const q = quizData.find(x => x.id === qId);
            const allFilled = q.blanks.every(b => st.answer[b.blankId].trim() !== '');
            document.getElementById('check-btn-' + qId).disabled = !allFilled;
            updateProgress();
        }

        function handleChipClick(qId, tokenId) {
            initAudio();
            const st = userState[qId];
            if(st.checked) return;
            playSelectSound();
            
            const idx = st.answer.indexOf(tokenId);
            if(idx === -1) {
                st.answer.push(tokenId);
                const chip = document.getElementById(`chip-${qId}-${tokenId}`);
                document.getElementById(`slot-${qId}`).appendChild(chip);
                chip.classList.add('in-slot');
            } else {
                st.answer.splice(idx, 1);
                const chip = document.getElementById(`chip-${qId}-${tokenId}`);
                document.getElementById(`bank-${qId}`).appendChild(chip);
                chip.classList.remove('in-slot');
            }
            
            const q = quizData.find(x => x.id === qId);
            document.getElementById('check-btn-' + qId).disabled = (st.answer.length !== q.words.length);
            updateProgress();
        }

        function checkAnswer(qId) {
            const q = quizData.find(x => x.id === qId);
            const st = userState[qId];
            if(st.checked) return;
            
            st.checked = true;
            let isAllCorrect = true;
            
            if (q.type === 'gap_fill_text') {
                q.blanks.forEach(b => {
                    const input = document.getElementById(`gap-${qId}-${b.blankId}`);
                    input.disabled = true;
                    input.classList.remove('pending');
                    
                    const userVal = normalizeAnswer(st.answer[b.blankId] || '');
                    const correctAnswers = b.correctAnswers.map(normalizeAnswer);
                    
                    if(correctAnswers.includes(userVal)) {
                        st.blankResults[b.blankId] = true;
                        input.classList.add('correct');
                    } else {
                        st.blankResults[b.blankId] = false;
                        input.classList.add('wrong');
                        isAllCorrect = false;
                        const span = document.createElement('span');
                        span.style.color = 'var(--color-correct)';
                        span.style.fontWeight = 'bold';
                        span.style.marginLeft = '8px';
                        span.innerText = '(' + b.correctAnswers[0] + ')';
                        input.parentNode.insertBefore(span, input.nextSibling);
                    }
                });
            } else if (q.type === 'reordering') {
                const userSentence = st.answer.map(tId => q.words.find(w => w.tokenId === tId).text).join(' ');
                const correctSentence = q.correctOrder.map(tId => q.words.find(w => w.tokenId === tId).text).join(' ');
                
                if (normalizeSentence(userSentence) === normalizeSentence(correctSentence)) {
                    isAllCorrect = true;
                } else {
                    isAllCorrect = false;
                }
                
                const slot = document.getElementById(`slot-${qId}`);
                slot.style.pointerEvents = 'none';
                if(!isAllCorrect) {
                    slot.style.borderColor = 'var(--color-wrong)';
                    slot.style.animation = 'shake 0.2s';
                    const div = document.createElement('div');
                    div.style.color = 'var(--color-correct)';
                    div.style.fontWeight = 'bold';
                    div.style.marginTop = '10px';
                    div.innerText = correctSentence;
                    slot.parentNode.insertBefore(div, slot.nextSibling);
                } else {
                    slot.style.borderColor = 'var(--color-correct)';
                    slot.style.backgroundColor = 'var(--color-correct)';
                    Array.from(slot.children).forEach(c => c.style.color = 'var(--color-primary)');
                }
            }
            
            st.isCorrect = isAllCorrect;
            if(isAllCorrect) playCorrectSound(); else playWrongSound();
            
            document.getElementById(`exp-${qId}`).style.display = 'block';
            document.getElementById(`check-btn-${qId}`).disabled = true;
        }

        function updateProgress() {
            let interacted = 0;
            quizData.forEach(q => {
                const st = userState[q.id];
                if(q.type === 'gap_fill_text') {
                    if(q.blanks.some(b => st.answer[b.blankId] && st.answer[b.blankId].trim() !== '')) interacted++;
                } else if(q.type === 'reordering') {
                    if(st.answer.length > 0) interacted++;
                }
            });
            document.getElementById('progressText').innerText = `${interacted}/${quizData.length}`;
            document.getElementById('progressBar').style.width = `${(interacted/quizData.length)*100}%`;
        }

        function submitQuiz() {
            let correctCount = 0;
            let wrongItemsHtml = '';
            let detailedMistakes = '';
            
            quizData.forEach(q => {
                const st = userState[q.id];
                if(!st.checked) {
                    // force check
                    if(q.type === 'gap_fill_text') {
                        q.blanks.forEach(b => { if(!st.answer[b.blankId]) st.answer[b.blankId] = ''; });
                    }
                    checkAnswer(q.id);
                }
                
                if(st.isCorrect) {
                    correctCount++;
                } else {
                    let userAnsText = '';
                    let correctAnsText = '';
                    if(q.type === 'gap_fill_text') {
                        let wrongBlanks = [];
                        q.blanks.forEach(b => {
                            if(!st.blankResults[b.blankId]) {
                                wrongBlanks.push(`[${escapeHTML(st.answer[b.blankId] || 'trống')} -> đúng là ${escapeHTML(b.correctAnswers[0])}]`);
                            }
                        });
                        userAnsText = st.answer ? Object.values(st.answer).join(', ') : '';
                        detailedMistakes += `Câu ${q.id}: Học sinh điền sai ở các chỗ trống: ${wrongBlanks.join(' ')}\n`;
                        
                        wrongItemsHtml += `<div class="card">`;
                        wrongItemsHtml += `<div><b>Câu ${q.id}:</b> ${q.questionHTML}</div>`;
                        wrongItemsHtml += `<div style="margin-top:10px; color:var(--color-wrong)">Các chỗ trống làm sai: ${wrongBlanks.join(', ')}</div>`;
                        wrongItemsHtml += `<div class="explanation" style="display:block; margin-top:10px;">${q.explanationHTML}</div>`;
                        wrongItemsHtml += `</div>`;
                        
                    } else if(q.type === 'reordering') {
                        userAnsText = st.answer.map(tId => q.words.find(w => w.tokenId === tId).text).join(' ');
                        correctAnsText = q.correctOrder.map(tId => q.words.find(w => w.tokenId === tId).text).join(' ');
                        detailedMistakes += `Câu ${q.id}: Học sinh ghép ${userAnsText} (sai), đáp án đúng là ${correctAnsText}\n`;
                        
                        wrongItemsHtml += `<div class="card">`;
                        wrongItemsHtml += `<div><b>Câu ${q.id}:</b> ${q.questionHTML}</div>`;
                        wrongItemsHtml += `<div style="margin-top:10px; color:var(--color-wrong)">Bạn ghép: ${escapeHTML(userAnsText)}</div>`;
                        wrongItemsHtml += `<div style="margin-top:5px; color:var(--color-correct)">Đáp án đúng: ${escapeHTML(correctAnsText)}</div>`;
                        wrongItemsHtml += `<div class="explanation" style="display:block; margin-top:10px;">${q.explanationHTML}</div>`;
                        wrongItemsHtml += `</div>`;
                    }
                }
            });
            
            const score = correctCount;
            document.getElementById('popupScore').innerText = `${score} / ${quizData.length}`;
            if(score === quizData.length) {
                playCorrectSound();
                document.getElementById('popupMessage').innerText = 'Tuyệt vời! Bạn đã làm đúng tất cả.';
            } else {
                playSubmitSound();
                document.getElementById('popupMessage').innerText = 'Hãy xem lại các câu sai bên dưới nhé.';
                document.getElementById('wrongItems').innerHTML = wrongItemsHtml;
                document.getElementById('wrongList').style.display = 'block';
            }
            
            document.getElementById('popupOverlay').style.display = 'flex';
            document.getElementById('btnSubmit').disabled = true;
            
            // Send to Google Form
            const formData = new URLSearchParams();
            formData.append('entry.1861648410', studentName);
            formData.append('entry.1691800437', score.toString());
            formData.append('entry.639295732', detailedMistakes || 'Không có lỗi sai');
            formData.append('entry.370465671', 'Unit 1 (Sections F-J)');
            
            fetch('https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse', {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            }).catch(e => console.error(e));
        }
        
        function closePopup() {
            document.getElementById('popupOverlay').style.display = 'none';
            if(document.getElementById('wrongList').style.display === 'block') {
                document.getElementById('wrongList').scrollIntoView({behavior: 'smooth'});
            }
        }
    </script>
</body>
</html>
